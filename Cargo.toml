[package]
name = "osmshrink"
version = "0.1.0"
edition = "2024"
description = "Download, filter, convert, and export geospatial data with an OpenStreetMap-focused pipeline"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
flatgeobuf = { version = "6.0.1", default-features = false, optional = true }
futures-util = { version = "0.3", optional = true }
geojson = "1"
geozero = { version = "0.15.1", default-features = false, features = ["with-geojson"], optional = true }
indicatif = { version = "0.17", optional = true }
osmpbfreader = "0.16"
redb = { version = "4.1", optional = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { version = "0.9", optional = true }
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
default = ["cli"]
cli = [
    "disk-index",
    "flatgeobuf",
    "dep:anyhow",
    "dep:clap",
    "dep:futures-util",
    "dep:indicatif",
    "dep:reqwest",
    "dep:serde_yaml",
    "dep:tempfile",
    "dep:tokio",
    "dep:tracing-subscriber",
]
disk-index = ["dep:redb", "dep:tempfile"]
flatgeobuf = ["dep:flatgeobuf", "dep:geozero", "dep:tempfile"]
wasm = []

[[bin]]
name = "osmshrink"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
criterion = "0.5"
protobuf = "2"

[[bench]]
name = "filter"
harness = false
required-features = ["cli"]

[[bench]]
name = "index_lookup"
harness = false
required-features = ["disk-index"]

[[bench]]
name = "selective_filter"
harness = false
required-features = ["cli"]
