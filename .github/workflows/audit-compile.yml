name: Audit compile validation
on:
  push:
    branches: [work/osmshrink-audit-ratchets]
    paths: [.github/workflows/audit-compile.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Resolve the pre-existing manifest lockfile mismatch
        continue-on-error: true
        shell: bash
        run: cargo check --all-features 2>&1 | tee "$RUNNER_TEMP/native-check.log"
      - name: Native regression tests
        continue-on-error: true
        shell: bash
        run: cargo test --locked --all-features 2>&1 | tee "$RUNNER_TEMP/native-tests.log"
      - name: Standalone FlatGeobuf library tests
        continue-on-error: true
        shell: bash
        run: cargo test --locked --no-default-features --features flatgeobuf --lib 2>&1 | tee "$RUNNER_TEMP/flatgeobuf-only.log"
      - name: Lint including benchmark compilation
        continue-on-error: true
        shell: bash
        run: cargo clippy --locked --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Preserve dependency resolution and source
        if: always()
        run: |
          rm -f .github/workflows/audit-compile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/audit-compile.yml
          git commit -m 'build: synchronize FlatGeobuf dependencies in Cargo.lock'
          git push origin HEAD:refs/heads/work/osmshrink-audit-ratchets
          git rev-parse HEAD > "$RUNNER_TEMP/validated-head.txt"
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-compile-validation
          retention-days: 7
          path: |
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/validated-head.txt
            ${{ runner.temp }}/*.log
