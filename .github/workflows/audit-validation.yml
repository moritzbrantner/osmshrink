name: Audit native validation
on:
  push:
    branches: [work/osmshrink-audit-ratchets]
    paths: [.github/workflows/audit-validation.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Apply reviewed native patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          text = ''.join(p.read_text() for p in sorted(pathlib.Path('_audit').glob('native-*.b64')))
          patch = lzma.decompress(base64.b64decode(text))
          assert hashlib.sha256(patch).hexdigest() == '078273d307bf685f076d66a1fb7fa2aecd03ec53808cd5f48e920d21cb1d0f38'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format and materialize reviewed changes
        run: |
          cargo fmt --all
          rm -rf _audit .github/workflows/audit-workspace.yml .github/workflows/audit-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: protect conversion integrity and ratchet selective filtering'
          git push origin HEAD:refs/heads/work/osmshrink-audit-ratchets
          git rev-parse HEAD | tee "$RUNNER_TEMP/validated-head.txt"
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
      - name: Feature boundaries
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo check --locked --no-default-features 2>&1 | tee "$RUNNER_TEMP/core.log"
          cargo check --locked --no-default-features --features flatgeobuf 2>&1 | tee "$RUNNER_TEMP/flatgeobuf-only.log"
          cargo check --locked --no-default-features --features disk-index 2>&1 | tee "$RUNNER_TEMP/disk-only.log"
      - name: Native regressions
        continue-on-error: true
        shell: bash
        run: cargo test --locked --all-features 2>&1 | tee "$RUNNER_TEMP/native-tests.log"
      - name: Lint and benchmark compile
        continue-on-error: true
        shell: bash
        run: cargo clippy --locked --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-audit-validation
          retention-days: 7
          path: |
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/validated-head.txt
            ${{ runner.temp }}/*.log
